<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            background-color: #050510;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 15px;
            text-align: center;
            border: 2px solid #00f3ff;
        }
        h2 {
            margin: 0 0 15px 0;
            color: #00f3ff;
            font-size: 18px;
            text-shadow: 0 0 5px #00f3ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }
        .status {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>VERITAS // SYSTEM</h2>
    
    <button id="btn1">OPEN DASHBOARD</button>
    
    <div class="status">SYSTEM ACTIVE</div>
    
    <script src="pop.js"></script>
</body>
</html>
